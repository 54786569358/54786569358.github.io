name: 发送成果报告

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Send report email
        env:
          QQ_USER: ${{ secrets.QQ_USER }}
          QQ_PASS: ${{ secrets.QQ_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python scripts/send_report.py
