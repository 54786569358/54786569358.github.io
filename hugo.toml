baseURL = "https://54786569358.github.io/"
locale = "zh-cn"
defaultContentLanguage = "zh-cn"
title = "燕绛的博客"
theme = "PaperMod"
enableRobotsTXT = true
hasCJKLanguage = true
enableEmoji = true
enableGitInfo = true

[frontmatter]
  lastmod = [":git", "lastmod", ":fileModTime", ":default"]

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  description = "记录、思考、折腾"
  keywords = ["博客", "随笔", "技术"]
  author = "燕绛"
  DateFormat = "2006-01-02"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = true
  disableScrollToTop = false
  comments = true
  hidemeta = false
  hideSummary = false
  showtoc = false
  tocopen = false
  mainSections = ["posts"]
  ShowFullTextinRSS = true
  math = false
  busuanzi = false

  [params.giscus]
    repo = "54786569358/54786569358.github.io"
    repoId = "R_kgDOV5n4Iw"
    category = "Announcements"
    categoryId = "DIC_kwDOV5n4I84DL18E"
    theme = "preferred_color_scheme"

  [params.assets]
    disableHLJS = true
    disableFingerprinting = false

  [params.homeInfoParams]
    Title = "你好，我是燕绛"
    Content = """
随手记的地方。

写技术、写折腾、偶尔写点生活。
"""

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/54786569358"

  [[params.socialIcons]]
    name = "rss"
    url = "index.xml"

  [params.profileMode]
    enabled = false
    title = "燕绛的博客"
    subtitle = "记录、思考、折腾"
    imageUrl = ""
    imageTitle = ""

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "moments"
    name = "微语"
    url = "/moments/"
    weight = 20
  [[menu.main]]
    identifier = "weather"
    name = "天气"
    url = "/weather/"
    weight = 25
  [[menu.main]]
    identifier = "gallery"
    name = "相册"
    url = "/gallery/"
    weight = 30
  [[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 40
  [[menu.main]]
    identifier = "write"
    name = "写文章"
    url = "/admin/"
    weight = 50

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = false
    lineNos = false
    anchorLineNos = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[params.waline]
  # leave empty to keep giscus; set to your Vercel URL to switch
  serverURL = ""
