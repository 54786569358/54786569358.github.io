baseURL = "https://54786569358.github.io/"
locale = "zh-cn"
defaultContentLanguage = "zh-cn"
title = "燕绛的博客"
theme = "PaperMod"
enableRobotsTXT = true
hasCJKLanguage = true
enableEmoji = true
enableGitInfo = true

[frontmatter]
  lastmod = [":git", "lastmod", ":fileModTime", ":default"]

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  description = "记录、思考、折腾"
  keywords = ["博客", "随笔", "技术"]
  author = "燕绛"
  DateFormat = "2006-01-02"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = true
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false
  mainSections = ["posts"]
  ShowFullTextinRSS = true

  [params.assets]
    disableHLJS = true
    disableFingerprinting = false

  [params.homeInfoParams]
    Title = "你好，我是燕绛"
    Content = """
这里是随手记的地方。

技术笔记、生活随笔、折腾过的东西，都往这儿放。
"""

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/54786569358"

  [params.profileMode]
    enabled = false
    title = "燕绛的博客"
    subtitle = "记录、思考、折腾"
    imageUrl = ""
    imageTitle = ""

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 20
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 30
  [[menu.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
    weight = 40
  [[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 50

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    anchorLineNos = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false
