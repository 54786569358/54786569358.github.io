{{- /* giscus comments — GitHub Discussions as the backend.
       The giscus GitHub App must be installed on the repo once:
       https://github.com/apps/giscus                                          */ -}}
{{- $giscus := site.Params.giscus -}}
{{- if and $giscus (or $giscus.repo $giscus.repoId) -}}
<div class="comments-wrap" style="margin-top:2.5rem">
  <h3 style="margin-bottom:1rem">评论</h3>
  <script src="https://giscus.app/client.js"
          data-repo="{{ $giscus.repo }}"
          data-repo-id="{{ $giscus.repoId }}"
          data-category="{{ $giscus.category }}"
          data-category-id="{{ $giscus.categoryId }}"
          data-mapping="pathname"
          data-strict="0"
          data-reactions-enabled="1"
          data-emit-metadata="0"
          data-input-position="top"
          data-theme="{{ if $giscus.theme }}{{ $giscus.theme }}{{ else }}preferred_color_scheme{{ end }}"
          data-lang="zh-CN"
          data-loading="lazy"
          crossorigin="anonymous"
          async>
  </script>
</div>
{{- end -}}
